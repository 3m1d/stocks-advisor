[app]
name = "stocks-advisor"
version = "0.1.0"
debug = false
log_level = "INFO"

[moex]
base_url = "https://iss.moex.com/iss"
timeout_connect = 30
timeout_sock_read = 60
timeout_total = 120

[api]
host = "0.0.0.0"
port = 8000
reload = false
workers = 1

[logging]
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
date_format = "%Y-%m-%d %H:%M:%S"

[history]
ignored_path_prefixes = [
    '/api/v1/jwt',
    '/api/v1/history',
    '/openapi.json',
    '/docs',
    '/redoc',
]
max_response_size = 10000

[mlflow]
tracking_uri = "http://localhost:5050"
s3_endpoint_url = "http://localhost:9000"
artifact_root = "s3://mlflow-bucket/mlflow"
aws_region = "us-east-1"
default_experiment = "stocks-advisor"
