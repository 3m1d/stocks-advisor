[project]
name = "year-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomoex>=2.1.2",
    "click>=8.3.0",
    "ipymarkup>=0.9.0",
    "matplotlib>=3.10.7",
    "natasha>=1.6.0",
    "navec>=0.10.0",
    "nltk>=3.9.2",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "setuptools>=80.9.0",
    "slovnet>=0.6.0",
    "ta>=0.11.0",
    "torch>=2.9.0",
    "trafilatura>=2.0.0",
    "transformers>=4.57.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 120
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I"]


[tool.ruff.format]
quote-style = "single"
indent-style = "space"
